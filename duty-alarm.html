<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>船町 乗務アラーム | 次バス大阪</title>
<meta name="description" content="船町6人乗務表の対象時刻30秒前に約1秒だけ鳴らす個人用Webアラーム。" />
<meta name="theme-color" content="#0b57d0" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/duty-alarm.css?v=59" />
</head>
<body>
<div class="app alarm-app">
  <header class="app-header alarm-header">
    <a class="back-btn" href="./" aria-label="次バス大阪へ戻る">‹</a>
    <h1>船町 乗務アラーム</h1>
  </header>

  <p id="alarm-caption" class="alarm-caption">乗務表の丸印時刻の30秒前に約1秒だけ鳴動</p>

  <section class="alarm-controls" aria-label="アラーム設定">
    <label class="alarm-field">
      <span>日区分</span>
      <select id="alarm-day">
        <option value="weekday">平日</option>
        <option value="holiday">休日</option>
      </select>
    </label>
    <div class="alarm-field alarm-duty-field">
      <span>勤務</span>
      <button id="alarm-all" class="alarm-all-option" type="button" aria-pressed="false">全て鳴らす</button>
      <div id="alarm-duty-grid" class="alarm-duty-grid" role="radiogroup" aria-label="勤務を選択"></div>
    </div>
    <div class="alarm-field alarm-sound-field">
      <span>音を選択</span>
      <div id="alarm-sound-grid" class="alarm-choice-grid" role="radiogroup" aria-label="音を選択">
        <button type="button" class="alarm-choice-option" data-sound="beep" role="radio">ビープ</button>
        <button type="button" class="alarm-choice-option" data-sound="chime" role="radio">チャイム</button>
        <button type="button" class="alarm-choice-option" data-sound="double" role="radio">2連音</button>
      </div>
    </div>
    <div class="alarm-field alarm-volume-field">
      <span>音量</span>
      <div id="alarm-volume-grid" class="alarm-choice-grid" role="radiogroup" aria-label="音量を選択">
        <button type="button" class="alarm-choice-option" data-volume="low" role="radio">小</button>
        <button type="button" class="alarm-choice-option" data-volume="medium" role="radio">中</button>
        <button type="button" class="alarm-choice-option" data-volume="high" role="radio">大</button>
      </div>
    </div>
    <div class="alarm-lead" aria-label="鳴らすタイミング">
      <span class="alarm-lead-title">何分・何秒前に鳴らす</span>
      <label>
        <input id="alarm-lead-minutes" type="number" min="0" max="59" inputmode="numeric" value="0" aria-label="何分前" />
        <span>分前</span>
      </label>
      <label>
        <input id="alarm-lead-seconds" type="number" min="0" max="59" inputmode="numeric" value="30" aria-label="何秒前" />
        <span>秒前</span>
      </label>
    </div>
  </section>

  <section class="alarm-next alarm-countdown-card" aria-live="polite">
    <p id="alarm-countdown" class="alarm-countdown alarm-countdown-main">残り時間を計算中</p>
  </section>

  <section class="alarm-actions alarm-actions-single">
    <button id="alarm-test" class="alarm-secondary" type="button">1秒テスト</button>
  </section>
  <p id="alarm-status" class="alarm-status" role="status" aria-live="polite">アプリ起動中は自動監視</p>

  <section class="alarm-list-card">
    <div class="alarm-list-head">
      <div>
        <h2>今日の時刻</h2>
        <p id="alarm-list-summary">--件</p>
      </div>
      <div class="alarm-legend" aria-label="凡例">
        <span><i class="dot dot-white"></i>白丸</span>
        <span><i class="dot dot-black"></i>黒丸</span>
      </div>
    </div>
    <ol id="alarm-time-list" class="alarm-time-list"></ol>
  </section>

  <aside class="alarm-note">
    <strong>Web版の注意</strong>
    <p>このページを開いている間は自動で監視します。画面OFF・省電力・他アプリ使用中はブラウザが停止して鳴らない場合があります。</p>
  </aside>
</div>
<script src="js/duty-alarm.js?v=59"></script>
<script>document.documentElement.dataset.alarmUi="buttons-only";</script>
</body>
</html>
