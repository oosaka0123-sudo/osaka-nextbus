name: Validate bus data

on:
  push:
    paths:
      - "data/**"
      - "js/**"
      - "index.html"
      - "sw.js"
      - "scripts/validate-data.mjs"
      - "scripts/validate-partial-calendar.test.mjs"
      - "scripts/report-corridor-coverage.mjs"
      - "scripts/report-corridor-coverage.test.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/validate-data.yml"
      - ".github/workflows/claude-implement.yml"
  pull_request:
    paths:
      - "data/**"
      - "js/**"
      - "index.html"
      - "sw.js"
      - "scripts/validate-data.mjs"
      - "scripts/validate-partial-calendar.test.mjs"
      - "scripts/report-corridor-coverage.mjs"
      - "scripts/report-corridor-coverage.test.mjs"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.js"
      - ".github/workflows/validate-data.yml"
      - ".github/workflows/claude-implement.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Validate timetable data
        run: node scripts/validate-data.mjs

      - name: Test partial calendar validation
        run: npm run test:partial-calendar-validator

      - name: Test corridor coverage audit
        run: npm run test:coverage-audit

      - name: Report production corridor coverage
        run: node scripts/report-corridor-coverage.mjs

      - name: Check JavaScript syntax
        run: |
          node --check js/timetable-loader.js
          node --check js/data.js
          node --check js/app.js
          node --check scripts/validate-partial-calendar.test.mjs
          node --check scripts/report-corridor-coverage.mjs

      - name: Install browser test dependencies
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:smoke
