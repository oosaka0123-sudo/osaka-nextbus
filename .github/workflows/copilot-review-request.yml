name: Request Copilot Review

on:
  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - synchronize

permissions:
  pull-requests: write

concurrency:
  group: copilot-review-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-copilot-review:
    if: >-
      ${{
        github.event.pull_request.draft == false &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'copilot-pull-request-reviewer[bot]'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Request Copilot review
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          REVIEWER="copilot-pull-request-reviewer[bot]"

          echo "Checking requested reviewers for PR #${PR_NUMBER} in ${REPO}..."
          REQUESTED_REVIEWERS=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" --jq '.users[].login' 2>/dev/null || true)

          if echo "$REQUESTED_REVIEWERS" | grep -Fxq "${REVIEWER}"; then
            echo "Reviewer $REVIEWER is already requested for PR #${PR_NUMBER}. Skipping."
            exit 0
          fi

          echo "Requesting review from $REVIEWER for PR #${PR_NUMBER}..."
          echo "{\"reviewers\":[\"${REVIEWER}\"]}" | gh api -X POST "repos/${REPO}/pulls/${PR_NUMBER}/requested_reviewers" --input -
