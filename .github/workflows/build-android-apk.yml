name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk osaka-nextbus.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: osaka-nextbus-apk
          path: osaka-nextbus.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest osaka-nextbus.apk             --target "$GITHUB_SHA"             --title "次バス大阪 Android APK"             --notes "次バス大阪＋船町乗務アラームのAndroidインストール版です。"             --latest
