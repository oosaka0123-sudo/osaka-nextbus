name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: osaka-nextbus-debug-keystore-v1

      - name: Build APK
        run: gradle -p android-app assembleDebug --no-daemon

      - name: Prepare download file
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk osaka-nextbus.apk

      - name: Verify APK signature and package metadata
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs osaka-nextbus.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging osaka-nextbus.apk
          unzip -t osaka-nextbus.apk

      - name: Install APK on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            adb install -r osaka-nextbus.apk
            adb shell pm path net.rss7.osakanextbus
            adb shell am start -W -n net.rss7.osakanextbus/.MainActivity

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: osaka-nextbus-apk
          path: osaka-nextbus.apk

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --cleanup-tag -y || true
          gh release create android-latest osaka-nextbus.apk             --target "$GITHUB_SHA"             --title "次バス大阪 Android APK"             --notes "次バス大阪＋船町乗務アラームのAndroidインストール版です。"             --latest
