name: Build Play AAB

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore upload keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/osaka-nextbus-upload.jks"
          chmod 600 "$RUNNER_TEMP/osaka-nextbus-upload.jks"

      - name: Build signed release AAB
        env:
          ANDROID_UPLOAD_KEYSTORE_PATH: ${{ runner.temp }}/osaka-nextbus-upload.jks
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: gradle -p android-app bundleRelease --no-daemon

      - name: Verify signed AAB
        run: |
          cp android-app/app/build/outputs/bundle/release/app-release.aab osaka-nextbus-play.aab
          jarsigner -verify -verbose -certs osaka-nextbus-play.aab
          unzip -t osaka-nextbus-play.aab

      - name: Upload Play AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: osaka-nextbus-play-aab
          path: osaka-nextbus-play.aab
          if-no-files-found: error
