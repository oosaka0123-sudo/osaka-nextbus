name: Test collector

on:
  push:
    paths:
      - "collector/**"
      - ".github/workflows/collector-tests.yml"
  pull_request:
    paths:
      - "collector/**"
      - ".github/workflows/collector-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run collector unit tests
        run: python3 -m unittest discover -s collector/tests -t .
