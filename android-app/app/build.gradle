plugins {
    id 'com.android.application'
}

android {
    namespace 'net.rss7.osakanextbus'
    compileSdk 36

    defaultConfig {
        applicationId 'net.rss7.osakanextbus'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.0.3'
    }

    flavorDimensions += "distribution"
    productFlavors {
        direct {
            dimension "distribution"
            applicationId 'net.rss7.osakanextbus'
            versionCode 4
            versionName '1.0.3'
        }
        play {
            dimension "distribution"
            applicationId 'net.rss7.osakanextbus.play'
            versionCode 1
            versionName '1.0.3'
        }
    }

    signingConfigs {
        release {
            def ks = System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH")
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv("ANDROID_UPLOAD_STORE_PASSWORD")
                keyAlias System.getenv("ANDROID_UPLOAD_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_UPLOAD_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
}
